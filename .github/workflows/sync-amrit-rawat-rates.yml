name: Amrit Rawat — Validate archived rate presentation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-archived-rate-presentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/open-estimation-engine-v0.1
          persist-credentials: false
      - run: node scripts/sync-amrit-rawat-rates.mjs --validate-current
      - run: |
          echo 'The standalone Amrit rate source is archived. Current rates are refreshed through the Estimating & BOQ publishing workflow.' >> "$GITHUB_STEP_SUMMARY"
