name: Amrit Rawat — Archived source status

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-status:
    runs-on: ubuntu-latest
    steps:
      - name: Report the archived source status
        run: |
          echo 'The former standalone Amrit rate register and measurement template are archived.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Use the Estimating & BOQ manual refresh for the current Rate Library. Amrit measurements require an admitted project source.' >> "$GITHUB_STEP_SUMMARY"
